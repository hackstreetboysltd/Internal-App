<!--
  Paste this into the EmailJS template Content field (HTML).
  Set the EmailJS Subject field to: {{subject}}
  Use triple braces for detail_html so lists render as HTML, not escaped tags.
-->
<div style="background:#f4f4f5;margin:0;padding:24px 12px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;padding:28px 24px;color:#18181b;">
    <div style="font-weight:800;letter-spacing:0.04em;font-size:18px;">
      HACKSTREETBOYS <span style="font-weight:600;opacity:0.7;">LTD</span>
    </div>
    <div style="margin-top:18px;font-size:11px;letter-spacing:0.14em;color:#a1a1aa;text-transform:uppercase;">
      {{eyebrow}}
    </div>
    <p style="margin:12px 0 0;font-size:16px;line-height:1.45;color:#27272a;">
      {{headline}}
    </p>
    {{#if detail_html}}
    <div style="margin-top:16px;background:#f4f4f5;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;color:#3f3f46;">
      {{{detail_html}}}
    </div>
    {{/if}}
    {{#if note}}
    <p style="margin:14px 0 0;font-size:14px;line-height:1.45;color:#52525b;">
      {{note}}
    </p>
    {{/if}}
    <p style="margin:16px 0 0;font-size:12px;color:#a1a1aa;">
      {{timestamp}}
    </p>
    <p style="margin:20px 0 0;">
      <a href="{{portal_url}}" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px;">
        {{cta_label}} →
      </a>
    </p>
    <p style="margin:22px 0 0;font-size:11px;line-height:1.45;color:#a1a1aa;">
      {{footer}}
    </p>
  </div>
</div>
