name: Next.js server build

on:
  push:
    branches:
      - main
      - next-port
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portal
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/portal
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-build-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create .env.local for build
        run: |
          cat > .env.local << EOF
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          SESSION_SECRET=${SESSION_SECRET}
          NEXT_PUBLIC_BASE_PATH=/Internal-App
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_PORTAL_URL=${{ secrets.PORTAL_URL }}
          EOF

      - name: Migrate
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Build (server mode)
        run: npm run build

      - name: Start server
        run: |
          npm run start -- -p 3001 &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3001/Internal-App/api/health/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy"
          exit 1

      - name: Smoke tests
        run: |
          node scripts/test-phase2.mjs http://localhost:3001/Internal-App
          node scripts/test-phase3.mjs http://localhost:3001/Internal-App
          node scripts/test-phase4.mjs http://localhost:3001/Internal-App
          node scripts/test-phase5.mjs http://localhost:3001/Internal-App
          node scripts/test-phase6.mjs http://localhost:3001/Internal-App
          node scripts/test-phase7.mjs
          node scripts/test-phase8.mjs http://localhost:3001/Internal-App
