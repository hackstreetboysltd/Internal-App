name: GitHub Pages (retired)

# Static Pages cannot host the server-backed portal (API routes, OAuth, Postgres, Redis).
# This workflow no longer deploys. Use a Node host — see docs/RUNBOOK.md.
# CI for lint/build/smoke tests: .github/workflows/next-build.yml

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Pages deploy retired
        run: |
          echo "GitHub Pages static deploy is retired."
          echo "Provision a Node.js host and point DNS there."
          echo "See docs/RUNBOOK.md and docs/IMPLEMENTATION_PLAN.md."
