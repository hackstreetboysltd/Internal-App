<!-- modules/goals/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../session-check.js"></script>
    <link rel="stylesheet" href="../apps/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <title>Goals</title>
    <style>
        .goals-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .workspace-goal-row {
            position: relative;
            display: flex;
            align-items: flex-start;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .workspace-goal-row:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(251, 113, 133, 0.25);
        }

        .workspace-goal-body {
            flex: 1;
            min-width: 0;
            width: 100%;
        }

        .workspace-goal-text {
            width: 100%;
            font-size: 0.9rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .workspace-goal-row.has-visible-actions .workspace-goal-text {
            padding-right: 56px;
        }

        .workspace-goal-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            margin-top: 6px;
            min-width: 0;
            padding-right: 72px;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .workspace-goal-footer-meta {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .workspace-goal-actions {
            position: absolute;
            top: 12px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 1;
        }

        .goal-created-stamp {
            position: absolute;
            right: 14px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            line-height: 1.25;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        .goal-created-time {
            font-size: 0.72rem;
            font-weight: 500;
            color: #9ca3af;
        }

        .goal-created-date {
            font-size: 0.68rem;
            color: #6b7280;
        }

        .workspace-select {
            position: relative;
            width: max-content;
            flex-shrink: 0;
        }

        .workspace-select-native {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .workspace-select-trigger {
            box-sizing: border-box;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            width: auto;
            margin: 0;
            padding: 0 28px 0 14px;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1;
            color: #f3f4f6;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            box-shadow: none;
            cursor: pointer;
        }

        .workspace-select-label {
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }

        .workspace-select-trigger:hover,
        .workspace-select.open .workspace-select-trigger {
            border-color: rgba(251, 113, 133, 0.5);
            background: rgba(15, 23, 42, 0.95);
            transform: none;
            box-shadow: none;
        }

        .workspace-select-trigger i {
            position: absolute;
            right: 11px;
            top: 50%;
            font-size: 0.62rem;
            color: #9ca3af;
            transform: translateY(-50%);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .workspace-select.open .workspace-select-trigger i {
            transform: translateY(-50%) rotate(180deg);
            color: #fb7185;
        }

        .workspace-select-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 100%;
            width: max-content;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 6px;
            z-index: 80;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        }

        .workspace-select.open .workspace-select-menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .workspace-select-option {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 0.85rem;
            line-height: 1;
            text-align: center;
            color: #e5e7eb;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .workspace-select-option:hover {
            background: rgba(251, 113, 133, 0.12);
            color: #fff;
        }

        .workspace-select-option.active {
            background: rgba(251, 113, 133, 0.18);
            color: #fb7185;
            font-weight: 600;
        }

        .workspace-select.full {
            width: 100%;
            margin-bottom: 14px;
        }

        .workspace-select.full .workspace-select-trigger {
            width: 100%;
        }

        .workspace-select.full .workspace-select-menu {
            left: 0;
            right: 0;
            width: 100%;
        }

        #sortCreatedBtn {
            box-sizing: border-box;
            width: 40px;
            height: 40px;
            margin: 0;
            padding: 0;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: #f3f4f6;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            box-shadow: none;
            cursor: pointer;
        }

        #sortCreatedBtn:hover {
            border-color: rgba(251, 113, 133, 0.5);
            background: rgba(15, 23, 42, 0.95);
            color: #fb7185;
            transform: none;
            box-shadow: none;
        }

        #workspacePagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            padding: 4px 2px 8px;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        #workspacePagination:empty {
            display: none;
        }

        #addGoalBtn {
            height: 40px;
            padding: 0 18px;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1;
            border-radius: 10px;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #addGoalBtn:hover {
            transform: none;
        }

        .infographics-bar {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            height: 8px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .infographics-fill {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .goal-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #4b5563;
            border-radius: 4px;
            margin-right: 12px;
            margin-top: 2px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .goal-checkbox:checked {
            background: #10b981;
            border-color: #10b981;
        }

        .goal-checkbox:checked::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 12px;
            display: block;
        }

        .goal-checkbox:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        .modal {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.75) !important;
            display: none;
            justify-content: center !important;
            align-items: center !important;
            z-index: 9999 !important;
            padding: 20px !important;
            box-sizing: border-box !important;
        }

        .modal.show {
            display: flex !important;
        }

        /* Constrain overall modal size, enable clipping for internal scroll control */
        .modal-content {
            background: #0f172a !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            width: 100% !important;
            max-width: 480px !important;
            height: auto !important;
            max-height: 85vh !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 20px !important;
            box-sizing: border-box !important;
            overflow: hidden !important;
        }

        .modal-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            padding-bottom: 8px !important;
            margin-bottom: 12px !important;
            flex-shrink: 0 !important;
        }

        /* Allow vertical scrolling inside the body of the modal when content overflows */
        .modal-body {
            flex: 1 !important;
            overflow-y: auto !important;
            padding-right: 4px;
        }

        /* Style scrollbar for a consistent look on supported layout engines */
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .goal-item-row {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
        }

        /* Dynamic Goal Items inside Modals */
        .goal-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .drag-handle {
            cursor: grab;
            color: #9ca3af;
            padding: 0 4px;
        }

        .goal-content {
            flex: 1;
            font-size: 0.85rem;
            color: white;
            word-break: break-word;
        }

        .goal-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 0;
        }

        .goal-actions {
            display: flex;
            gap: 4px;
        }

        .goal-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            width: auto;
            margin-bottom: 0;
            box-shadow: none;
        }

        .goal-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* App tag dropdown items container */
        .app-tag-item {
            padding: 6px 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
            height: 32px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        /* Rich Text input simulator */
        .rte-input {
            width: 100%;
            min-height: 38px;
            box-sizing: border-box;
            padding: 8px 12px;
            border-radius: 10px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            white-space: pre-wrap;
            word-break: break-word;
            transition: all 0.25s ease;
        }

        .rte-input:focus {
            border-color: #fb7185;
            box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.2);
            background-color: rgba(15, 23, 42, 0.8);
        }

        .rte-input:empty:before {
            content: attr(data-placeholder);
            color: #6b7280;
        }

        @keyframes skeleton-pulse {
            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.85;
            }
        }

        .goals-skeleton {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            min-height: 260px;
        }

        .goals-skeleton-row {
            position: relative;
            display: flex;
            align-items: flex-start;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 72px;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }

        .goals-skeleton-row:nth-child(2) {
            animation-delay: 0.12s;
        }

        .goals-skeleton-row:nth-child(3) {
            animation-delay: 0.24s;
        }

        .goals-skeleton-row:nth-child(4) {
            animation-delay: 0.36s;
        }

        .goals-skeleton-row:nth-child(5) {
            animation-delay: 0.48s;
        }

        .goals-skeleton-check {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            margin-right: 12px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .goals-skeleton-body {
            flex: 1;
            min-width: 0;
        }

        .goals-skeleton-line {
            height: 12px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
        }

        .goals-skeleton-line + .goals-skeleton-line {
            margin-top: 8px;
        }

        .goals-skeleton-line.medium {
            width: 78%;
        }

        .goals-skeleton-line.short {
            width: 52%;
        }

        .goals-skeleton-line.meta {
            width: 38%;
            height: 10px;
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.06);
        }

        .goals-skeleton-stamp {
            position: absolute;
            right: 14px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .goals-skeleton-stamp span {
            display: block;
            height: 8px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.06);
        }

        .goals-skeleton-stamp span:first-child {
            width: 58px;
        }

        .goals-skeleton-stamp span:last-child {
            width: 48px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Top row with Back navigation link and Centered Title -->
        <div class="header-container"
            style="display: grid; grid-template-columns: 40px 1fr auto; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px">
            <!-- Left spacer to keep the title centered -->
            <div></div>

            <!-- Center App Title -->
            <h2 style="margin: 0 auto; border-bottom: none; padding-bottom: 0; font-size: 1.8rem; display: flex; flex-direction: column; align-items: center; gap: 4px">
                <span>Goals</span>
            </h2>

            <!-- Far right Refresh + Close -->
            <div class="header-actions-right" style="display: flex; align-items: center; gap: 4px; justify-self: end">
                <button class="refresh-btn" onclick="handleWorkspaceRefresh()" title="Refresh entries"
                style="background: none; border: none; cursor: pointer; color: #fb7185; padding: 0; width: 32px; height: 32px; box-shadow: none; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; opacity: 0.65; transition: opacity 0.2s, transform 0.2s;"
                onmouseover="this.style.opacity='1'; this.style.transform='scale(1.1)'"
                onmouseout="this.style.opacity='0.65'; this.style.transform='scale(1)'">
                <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <button class="close-module-btn" onclick="window.parent.showDashboard()" title="Close module"
                    style="background: none; border: none; cursor: pointer; color: #fb7185; padding: 0; width: 32px; height: 32px; box-shadow: none; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; opacity: 0.65; transition: opacity 0.2s, transform 0.2s"
                    onmouseover="this.style.opacity='1'; this.style.transform='scale(1.1)'"
                    onmouseout="this.style.opacity='0.65'; this.style.transform='scale(1)'">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- Search + Filters & New Goal -->
        <div
            style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap">
            <div class="search-input-wrapper" style="flex: 1; min-width: 180px">
                <input type="text" id="searchWorkspace" placeholder="Enter keyword..."
                    oninput="renderWorkspace()">
            </div>
            <button type="button" id="sortCreatedBtn" onclick="toggleCreatedSort()" title="Newest first">
                <i class="fa-solid fa-arrow-down-wide-short"></i>
            </button>
            <div class="workspace-select" data-select="timeframeFilterDropdown">
                <select id="timeframeFilterDropdown" class="workspace-select-native" onchange="handleTimeframeFilterChange()" title="Filter by timeframe">
                    <option value="all">All time</option>
                    <option value="annual">Annual</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="monthly">Monthly</option>
                    <option value="weekly">Weekly</option>
                    <option value="daily">Daily</option>
                </select>
                <button type="button" class="workspace-select-trigger" aria-haspopup="listbox">
                    <span class="workspace-select-label">All time</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="workspace-select-menu" role="listbox"></div>
            </div>
            <div class="workspace-select" data-select="memberFilterDropdown">
                <select id="memberFilterDropdown" class="workspace-select-native" onchange="handleMemberFilterChange()" title="Filter by team member">
                    <option value="all">All users</option>
                </select>
                <button type="button" class="workspace-select-trigger" aria-haspopup="listbox">
                    <span class="workspace-select-label">All users</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="workspace-select-menu" role="listbox"></div>
            </div>
            <button id="addGoalBtn" onclick="handleOpenUnifiedModal()"
                style="width: auto; margin-bottom: 0; background: #fb7185; border-color: #fb7185; color: white; flex-shrink: 0">
                <i class="fa-solid fa-plus"></i> New Goal
            </button>
        </div>

        <!-- Loader Section -->
        <div id="workspaceLoader" class="goals-skeleton" aria-busy="true" aria-label="Loading goals">
            <div class="goals-skeleton-row">
                <div class="goals-skeleton-check"></div>
                <div class="goals-skeleton-body">
                    <div class="goals-skeleton-line medium"></div>
                    <div class="goals-skeleton-line short"></div>
                    <div class="goals-skeleton-line meta"></div>
                </div>
                <div class="goals-skeleton-stamp"><span></span><span></span></div>
            </div>
            <div class="goals-skeleton-row">
                <div class="goals-skeleton-check"></div>
                <div class="goals-skeleton-body">
                    <div class="goals-skeleton-line medium"></div>
                    <div class="goals-skeleton-line short"></div>
                    <div class="goals-skeleton-line meta"></div>
                </div>
                <div class="goals-skeleton-stamp"><span></span><span></span></div>
            </div>
            <div class="goals-skeleton-row">
                <div class="goals-skeleton-check"></div>
                <div class="goals-skeleton-body">
                    <div class="goals-skeleton-line medium"></div>
                    <div class="goals-skeleton-line short"></div>
                    <div class="goals-skeleton-line meta"></div>
                </div>
                <div class="goals-skeleton-stamp"><span></span><span></span></div>
            </div>
            <div class="goals-skeleton-row">
                <div class="goals-skeleton-check"></div>
                <div class="goals-skeleton-body">
                    <div class="goals-skeleton-line medium"></div>
                    <div class="goals-skeleton-line short"></div>
                    <div class="goals-skeleton-line meta"></div>
                </div>
                <div class="goals-skeleton-stamp"><span></span><span></span></div>
            </div>
        </div>

        <!-- Content Section (Initially Hidden) -->
        <div id="workspaceContent" style="display: none">
        <div id="goalsList" class="goals-grid"></div>
        <div id="workspacePagination"></div>
        </div>
    </div>

    <!-- Unified Dynamic Modal for adding all goal types -->
    <div id="unifiedGoalModal" class="modal" style="display: none">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="unifiedModalTitle" style="margin: 0 auto; color: #fb7185">New Goal</h3>
                <span class="close-btn" onclick="closeUnifiedModal()">&times;</span>
            </div>
            <div class="modal-body">
                <label for="goalHorizonSelect"
                    style="font-size:0.85rem; color:#9ca3af; display:block; margin-bottom:6px">Goal Horizon</label>
                <div class="workspace-select full" data-select="goalHorizonSelect">
                    <select id="goalHorizonSelect" class="workspace-select-native" onchange="handleHorizonChange()">
                        <option value="annual">Annual</option>
                        <option value="quarterly">Quarterly</option>
                        <option value="monthly">Monthly</option>
                        <option value="weekly">Weekly</option>
                        <option value="daily">Daily</option>
                    </select>
                    <button type="button" class="workspace-select-trigger" aria-haspopup="listbox">
                        <span class="workspace-select-label">Annual</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="workspace-select-menu" role="listbox"></div>
                </div>

                <!-- Label with Info Button -->
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px">
                    <label id="itemsLabel"
                        style="font-size:0.85rem; color:#9ca3af; margin-bottom:0">Commitments</label>
                    <button type="button" onclick="openValidationInfoModal()" title="View goal requirements"
                        style="background: none; border: none; cursor: pointer; color: #fb7185; padding: 0; width: auto; box-shadow: none; font-size: 0.95rem; display: inline-flex; align-items: center; opacity: 0.8; transition: opacity 0.2s, transform 0.2s"
                        onmouseover="this.style.opacity='1'; this.style.transform='scale(1.15)'"
                        onmouseout="this.style.opacity='0.8'; this.style.transform='scale(1)'">
                        <i class="fa-solid fa-circle-info"></i>
                    </button>
                </div>

                <!-- Input area containing app-tag dropdown system wrapper -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-start">
                    <div style="position: relative; flex: 1; display: flex; flex-direction: column">
                        <!-- Input replaced with contenteditable div for styling inline purple tags as you type -->
                        <div id="goalItemInput" class="rte-input" contenteditable="true"
                            data-placeholder="Add an item... (Type @ to tag an app)"></div>

                        <!-- Interactive App Tag autocomplete dropdown -->
                        <div id="appTagDropdown"
                            style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; z-index: 10001; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); padding: 8px; box-sizing: border-box; margin-top: 4px">
                            <input type="text" id="appTagSearch" placeholder="Filter applications..." autocomplete="off"
                                style="padding: 6px 10px; font-size: 0.8rem; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); color: white; margin-bottom: 6px; border-radius: 4px; box-sizing: border-box; width: 100%">
                            <div id="appTagList"
                                style="max-height: 112px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px">
                                <!-- Options rendered dynamically -->
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="addGoalItemUI('modalItemsList', 'goalItemInput')"
                        style="width: auto; background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.3); color: #fb7185; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin-bottom: 0; box-shadow: none; height: 38px">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <ul id="modalItemsList"
                    style="list-style: none; padding: 0; margin: 0; min-height: 50px; max-height: 220px; overflow-y: auto">
                </ul>

                <button onclick="saveUnifiedGoal()"
                    style="margin-top:20px; background: #fb7185; border-color: #fb7185; font-weight: 600; width: 100%">
                    Commit Goal
                </button>
            </div>
        </div>
    </div>

    <!-- Requirements Info Modal -->
    <div id="validationInfoModal" class="modal" style="display: none">
        <div class="modal-content" style="max-width: 400px !important">
            <div class="modal-header">
                <h3 style="margin: 0 auto; display: flex; align-items: center; gap: 8px; color: #fb7185">
                    <i class="fa-solid fa-circle-info"></i> Goal Requirements
                </h3>
                <span class="close-btn" onclick="closeValidationInfoModal()">&times;</span>
            </div>
            <div class="modal-body"
                style="font-size: 0.9rem; line-height: 1.6; color: #9ca3af; text-align: center; padding: 10px 0">
                <p style="margin: 0 0 16px 0">To ensure precise planning and tracking, entries committed to the
                    platform must align with the following rules:</p>
                <div
                    style="display: flex; flex-direction: column; gap: 10px; align-items: center; margin-bottom: 10px">
                    <div style="display: flex; align-items: center; gap: 8px; color: white; font-weight: 600">
                        <i class="fa-solid fa-circle-check" style="color: #fb7185"></i>
                        <span>Minimum: 1 item</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; color: white; font-weight: 600">
                        <i class="fa-solid fa-circle-check" style="color: #fb7185"></i>
                        <span>Maximum: 15 items</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../env-config.js"></script>
    <script type="module" src="../../firebase-init.js"></script>
    <script src="../../email-notify.js"></script>
    <script src="all-goals.js"></script>
</body>

</html>
